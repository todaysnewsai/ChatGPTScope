title: "ChatGPTScope"
description: "Explore ChatGPT. Understand AI. Independent news, practical guides, troubleshooting, feature explainers, and analysis about ChatGPT and artificial intelligence."
url: "https://chatgptscope.com"
repository: "todaysnewsai/ChatGPTScope"
baseurl: ""
lang: "en-US"
timezone: "UTC"

markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/
paginate: 10
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: "ChatGPTScope"
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
