title: "Articles About AI"
description: "Independent news, reviews, comparisons, and practical guides to AI tools and assistants, including ChatGPT, Google Gemini, Claude, DeepSeek, Microsoft Copilot, Perplexity, and emerging AI models."
url: "https://todaysnewsai.github.io"
repository: "todaysnewsai/ChatGPTScope"
baseurl: "/ChatGPTScope"
lang: "en-US"
timezone: "UTC"
encoding: UTF-8

markdown: kramdown
permalink: /:categories/:year/:month/:day/:title/
paginate: 9
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: "Articles About AI"
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
