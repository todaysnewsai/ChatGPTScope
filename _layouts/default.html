<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">AI Tech Articles</a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/news/' | relative_url }}">News</a>
        <a href="{{ '/tools/' | relative_url }}">AI Tools</a>
        <a href="{{ '/models/' | relative_url }}">AI Models</a>
        <a href="{{ '/guides/' | relative_url }}">Guides</a>
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <a href="{{ '/analysis/' | relative_url }}">Analysis</a>
      </nav>
    </div>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© {{ 'now' | date: "%Y" }} AI Tech Articles</p>
      <nav aria-label="Footer navigation">
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="{{ '/editorial-policy/' | relative_url }}">Editorial Policy</a>
      </nav>
    </div>
  </footer>
</body>
</html>
