<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT vs Google Gemini: choose by workflow</title>
  <desc id="desc">An original editorial illustration of a balanced brass scale on an ivory field. A teal speech tile sits on one pan and a multicolour four-point star sits on the other, showing that the better AI assistant depends on the user's workflow rather than a universal winner.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ed"/>
      <stop offset="1" stop-color="#eee5d5"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f472e"/>
      <stop offset="0.5" stop-color="#c58a4a"/>
      <stop offset="1" stop-color="#7c3b2d"/>
    </linearGradient>
    <linearGradient id="tealTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5eee4"/>
      <stop offset="1" stop-color="#a7d6ca"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#2a2924" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#paper)"/>
  <path d="M0 535 C190 480 330 575 510 536 S875 485 1200 540 V675 H0Z" fill="#e4d8c5" opacity=".52"/>
  <g fill="none" stroke="#cbbba3" stroke-width="1" opacity=".62">
