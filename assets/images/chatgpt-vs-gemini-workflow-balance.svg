    <path d="M48 610H1152" stroke-dasharray="2 8"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="58" y="53" fill="#645a4c" font-size="15" font-weight="700" letter-spacing="2.5">ARTICLES ABOUT AI  /  COMPARISON GUIDE</text>
    <text x="58" y="112" fill="#202421" font-size="44" font-weight="700" letter-spacing="-1.2">Two assistants. Different ecosystems.</text>
    <text x="60" y="145" fill="#5e5b52" font-size="19">Choose the tool that fits the work—not the loudest model claim.</text>
  </g>
  <g filter="url(#shadow)">
    <path d="M597 236 L603 236 L642 518 L558 518Z" fill="url(#brass)"/>
    <path d="M516 520 Q600 497 684 520 L704 544 Q600 560 496 544Z" fill="#262a26"/>
