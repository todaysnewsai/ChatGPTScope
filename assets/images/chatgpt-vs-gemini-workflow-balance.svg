    <path d="M305 254 L895 254" stroke="#c58a4a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="600" cy="260" r="23" fill="#282c27" stroke="#c58a4a" stroke-width="5"/>
    <circle cx="600" cy="260" r="7" fill="#f8f0df"/>
