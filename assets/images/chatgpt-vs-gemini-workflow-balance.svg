    <text x="306" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#202421">CHATGPT</text>
    <text x="306" y="456" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.2" fill="#5e5b52">TOOLS · PROJECTS</text>
