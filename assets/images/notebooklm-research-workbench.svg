<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">NotebookLM research: trace claims back to sources</title>
<desc id="desc">An original editorial labyrinth illustration. A terracotta route travels through deep-green maze walls toward a checked evidence point, with small source symbols outside the maze. The visual represents navigating a research collection and tracing a conclusion back to supporting material.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f1e5"/><stop offset="1" stop-color="#e4e8d9"/></linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#315e50"/><stop offset="1" stop-color="#1c3b34"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#213a31" flood-opacity=".15"/></filter>
  <pattern id="speckle" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="5" cy="8" r="1" fill="#b9ad94" opacity=".35"/><circle cx="23" cy="21" r=".8" fill="#b9ad94" opacity=".28"/></pattern>
</defs>
<rect width="1200" height="675" fill="url(#paper)"/>
<rect width="1200" height="675" fill="url(#speckle)"/>
<path d="M0 0H1200V120C1010 95 860 144 665 115S255 76 0 132Z" fill="#fffaf0" opacity=".62"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="64" y="62" fill="#31594c" font-size="16" font-weight="700" letter-spacing="3">ARTICLES ABOUT AI  /  RESEARCH GUIDE</text>
 <text x="64" y="115" fill="#1d3c34" font-size="37" font-weight="700">Find the path back to evidence</text>
 <text x="66" y="148" fill="#5d7265" font-size="18">A useful answer should have a traceable route.</text>
</g>
<!-- source glyphs outside the maze: book, web page, and video -->
<g transform="translate(76 248)" filter="url(#shadow)">
 <path d="M0 9Q37 -2 67 15V88Q36 72 0 84Z" fill="#fffaf0" stroke="#31594c" stroke-width="3"/>
 <path d="M67 15Q98 -2 133 9V84Q99 72 67 88Z" fill="#e6ddcb" stroke="#31594c" stroke-width="3"/>
 <path d="M67 15V88" stroke="#b7a88e" stroke-width="3"/>
 <path d="M14 29L52 33M14 43L52 47M82 32L119 28M82 46L119 42" stroke="#9d9b83" stroke-width="3" stroke-linecap="round"/>
 <text x="66" y="116" fill="#31594c" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">PAPERS</text>
</g>
<g transform="translate(78 432)" filter="url(#shadow)">
 <path d="M8 0H111L127 17V84H8Z" fill="#fffaf0" stroke="#31594c" stroke-width="3"/>
 <path d="M111 0V17H127" fill="#d7e3d4" stroke="#31594c" stroke-width="3" stroke-linejoin="round"/>
 <rect x="22" y="23" width="40" height="7" rx="3.5" fill="#b65f43"/>
 <path d="M22 43H105M22 56H96M22 69H101" stroke="#a9aa94" stroke-width="3" stroke-linecap="round"/>
 <text x="68" y="111" fill="#31594c" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">WEB PAGES</text>
</g>
<g transform="translate(245 508)">
 <circle cx="0" cy="0" r="30" fill="#d7a95f"/>
 <path d="M-8 -13L13 0L-8 13Z" fill="#1f4036"/>
 <text x="0" y="51" fill="#31594c" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">VIDEO</text>
</g>
<!-- labyrinth walls; deliberately not a dashboard or source-card workflow -->
<g fill="none" stroke="url(#ink)" stroke-width="13" stroke-linecap="square" stroke-linejoin="round" filter="url(#shadow)">
 <path d="M350 205H840V560H315V278H785V505H390V330H730V455H465V382H660"/>
 <path d="M430 205V250M520 205V230M610 205V265M700 205V245"/>
 <path d="M840 300H800M840 390H820M840 480H800"/>
 <path d="M430 560V520M535 560V535M640 560V520M745 560V535"/>
 <path d="M315 360H355M315 445H340M315 520H365"/>
 <path d="M480 278V300M580 278V315M680 278V300"/>
 <path d="M785 365H750M785 435H765"/>
 <path d="M390 390H425M390 465H415"/>
 <path d="M510 330V350M605 330V365"/>
</g>
<!-- a single highlighted route winding through the maze -->
<path d="M260 348H350V232H805V535H350V305H750V480H420V356H695V430H565V405H630" fill="none" stroke="#bd6847" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 0"/>
<g fill="#bd6847">
 <circle cx="260" cy="348" r="10"/>
 <circle cx="350" cy="232" r="8"/>
 <circle cx="805" cy="535" r="8"/>
</g>
<!-- central evidence point -->
<g transform="translate(630 405)">
 <circle r="29" fill="#f7f1e5" stroke="#bd6847" stroke-width="5"/>
 <path d="M-12 0L-3 10L15 -12" fill="none" stroke="#31594c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- explanatory legend -->
<g transform="translate(920 236)" font-family="Arial,Helvetica,sans-serif">
 <text x="0" y="0" fill="#31594c" font-size="14" font-weight="700" letter-spacing="2">THE RESEARCH LOOP</text>
 <path d="M0 26H190" stroke="#bd6847" stroke-width="4" stroke-linecap="round"/>
 <g fill="#294b40" font-size="17">
  <text x="0" y="66">01  Curate sources</text>
  <text x="0" y="108">02  Ask a question</text>
  <text x="0" y="150">03  Trace citations</text>
  <text x="0" y="192">04  Verify the claim</text>
 </g>
 <g fill="#bd6847">
  <circle cx="-12" cy="60" r="4"/><circle cx="-12" cy="102" r="4"/><circle cx="-12" cy="144" r="4"/><circle cx="-12" cy="186" r="4"/>
 </g>
 <text x="0" y="246" fill="#617469" font-size="14">The source set shapes</text>
 <text x="0" y="266" fill="#617469" font-size="14">what the answer can support.</text>
</g>
<text x="64" y="632" fill="#31594c" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="2">CURATE  /  QUESTION  /  TRACE  /  VERIFY</text>
</svg>