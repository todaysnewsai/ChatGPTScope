<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">ChatGPT Voice Mode: the shape of a spoken conversation</title>
<desc id="desc">An original abstract editorial soundscape: a sculptural ear-like spiral on the left receives sweeping ribbons of sound that unfold into a bright, irregular waveform on the right. A deep cobalt field, pale lavender arcs, and a sharp citron accent depict listening and speaking without imitating an app interface.</desc>
<defs>
  <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101A49"/><stop offset="1" stop-color="#292B72"/></linearGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4EFFF"/><stop offset=".55" stop-color="#B7B8FF"/><stop offset="1" stop-color="#777DFF"/></linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F36B"/><stop offset="1" stop-color="#C6F26D"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#777DFF" stop-opacity=".36"/><stop offset="1" stop-color="#777DFF" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="675" fill="url(#field)"/>
<circle cx="345" cy="345" r="290" fill="url(#glow)"/>
<g fill="none" stroke="#858AFF" stroke-width="1.5" opacity=".32">
  <circle cx="345" cy="344" r="248"/><circle cx="345" cy="344" r="214"/><circle cx="345" cy="344" r="180"/>
</g>
<text x="70" y="68" fill="#D4D7FF" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="4">ARTICLES ABOUT AI  /  PRACTICAL GUIDE</text>
<text x="70" y="125" fill="#FFFFFF" font-family="Georgia,serif" font-size="48" font-weight="700">ChatGPT Voice Mode</text>
<text x="72" y="162" fill="#C9CBF8" font-family="Arial,Helvetica,sans-serif" font-size="19">A conversation shaped by sound</text>
