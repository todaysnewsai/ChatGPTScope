<path d="M350 449C299 447 270 404 271 348C272 294 300 263 338 264C377 264 399 292 396 326C394 348 382 363 363 377C343 391 338 414 350 430" fill="none" stroke="url(#ribbon)" stroke-width="20" stroke-linecap="round"/>
