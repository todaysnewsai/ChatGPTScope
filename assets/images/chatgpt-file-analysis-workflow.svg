<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">How to upload files to ChatGPT and analyze them</title>
<desc id="desc">An editorial illustration of a document being added to a chat workspace, with extracted text, a chart, and a comparison table arranged as analysis outputs.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101d35"/><stop offset="1" stop-color="#183e55"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#e5edf0"/></linearGradient>
</defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<circle cx="1035" cy="90" r="190" fill="#2fbaaa" opacity=".10"/><circle cx="120" cy="610" r="240" fill="#f1b95b" opacity=".09"/>
<text x="76" y="88" fill="#a9d9d3" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">ARTICLES ABOUT AI • PRACTICAL GUIDE</text>
<text x="76" y="153" fill="#ffffff" font-family="Arial,sans-serif" font-size="43" font-weight="700">From file to useful insight</text>
<text x="78" y="192" fill="#c4d5e0" font-family="Arial,sans-serif" font-size="21">Upload • Ask • Check the evidence</text>
<!-- file card -->
<rect x="76" y="246" width="280" height="330" rx="18" fill="#ffffff" opacity=".08" stroke="#9cb9ca" stroke-opacity=".5"/>
<path d="M155 286h95l42 42v145H155z" fill="url(#paper)"/>
<path d="M250 286v43h42" fill="#c8d9e0"/>
<rect x="177" y="354" width="93" height="9" rx="4" fill="#4e7889"/><rect x="177" y="378" width="75" height="7" rx="3" fill="#9bb3bd"/><rect x="177" y="397" width="92" height="7" rx="3" fill="#9bb3bd"/><rect x="177" y="416" width="66" height="7" rx="3" fill="#9bb3bd"/>
<rect x="179" y="449" width="90" height="25" rx="6" fill="#d5f1e9"/><text x="224" y="466" text-anchor="middle" fill="#17665d" font-family="Arial,sans-serif" font-size="13" font-weight="700">PDF / DOCX</text>
<text x="216" y="530" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Your source file</text>
<!-- arrow -->
<path d="M378 408h78m-22-18 22 18-22 18" fill="none" stroke="#f1b95b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<!-- chat prompt -->
<rect x="475" y="266" width="290" height="115" rx="20" fill="#f6f8fb"/>
<circle cx="508" cy="301" r="11" fill="#2fbaaa"/><rect x="531" y="293" width="192" height="9" rx="4" fill="#8ca5b0"/><rect x="531" y="311" width="160" height="9" rx="4" fill="#b6c6cd"/>
<text x="505" y="352" fill="#1c3348" font-family="Arial,sans-serif" font-size="17" font-weight="700">“Summarize the key findings.”</text>
<path d="M620 393v30m-10-10 10 10 10-10" fill="none" stroke="#f1b95b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<!-- outputs -->
<rect x="475" y="440" width="290" height="136" rx="18" fill="#ffffff" opacity=".09" stroke="#9cb9ca" stroke-opacity=".5"/>
<text x="499" y="472" fill="#ffffff" font-family="Arial,sans-serif" font-size="17" font-weight="700">ANALYSIS OUTPUTS</text>
<rect x="500" y="492" width="72" height="58" rx="8" fill="#d5f1e9"/><path d="M514 535v-14h9v14m7 0v-25h9v25m7 0v-34h9v34" stroke="#177e72" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="586" y="492" width="151" height="16" rx="5" fill="#dce8ed"/><rect x="586" y="517" width="128" height="8" rx="4" fill="#8baab6"/><rect x="586" y="533" width="138" height="8" rx="4" fill="#8baab6"/>
<!-- checklist -->
<rect x="815" y="246" width="309" height="330" rx="18" fill="#ffffff" opacity=".08" stroke="#9cb9ca" stroke-opacity=".5"/>
<text x="848" y="291" fill="#ffffff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Review before relying</text>
<g font-family="Arial,sans-serif" font-size="17" fill="#dce9ee">
<circle cx="852" cy="337" r="10" fill="#2fbaaa"/><path d="m847 337 4 4 7-9" stroke="#102d3e" stroke-width="2.5" fill="none"/><text x="875" y="343">Check figures and quotes</text>
<circle cx="852" cy="386" r="10" fill="#2fbaaa"/><path d="m847 386 4 4 7-9" stroke="#102d3e" stroke-width="2.5" fill="none"/><text x="875" y="392">Confirm source context</text>
<circle cx="852" cy="435" r="10" fill="#2fbaaa"/><path d="m847 435 4 4 7-9" stroke="#102d3e" stroke-width="2.5" fill="none"/><text x="875" y="441">Look for missing pages</text>
<circle cx="852" cy="484" r="10" fill="#2fbaaa"/><path d="m847 484 4 4 7-9" stroke="#102d3e" stroke-width="2.5" fill="none"/><text x="875" y="490">Protect sensitive data</text>
</g>
<text x="848" y="539" fill="#f1b95b" font-family="Arial,sans-serif" font-size="15" font-weight="700">AI output is a draft to verify.</text>
</svg>