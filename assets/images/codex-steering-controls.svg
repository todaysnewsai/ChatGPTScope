<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Codex steering controls</title><desc id="d">A bright editorial illustration of a coding terminal with a live steering panel and queued tasks.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f7f3"/><stop offset="1" stop-color="#d8e8fa"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087d72"/><stop offset="1" stop-color="#2778e8"/></linearGradient></defs><rect width="1200" height="800" fill="url(#bg)"/><circle cx="1020" cy="140" r="130" fill="#b8e4dd" opacity=".55"/><rect x="115" y="135" width="720" height="500" rx="22" fill="#fff" stroke="#c6d9dc" stroke-width="3"/><path d="M115 188H835" stroke="#d9e4e5" stroke-width="3"/><circle cx="151" cy="162" r="7" fill="#ed6d65"/><circle cx="177" cy="162" r="7" fill="#f3bd53"/><circle cx="203" cy="162" r="7" fill="#58bf91"/><rect x="150" y="220" width="285" height="360" rx="12" fill="#142c3c"/><g font-family="monospace" font-size="23"><text x="180" y="272" fill="#66e1c0">function</text><text x="285" y="272" fill="#fff"> build()</text><text x="180" y="316" fill="#8cb9ff">  await agent</text><text x="180" y="360" fill="#fff">  review(task);</text><text x="180" y="404" fill="#f7ca7c">  return result;</text><text x="180" y="448" fill="#6de0bf">}</text><rect x="475" y="220" width="315" height="148" rx="12" fill="#edf6f5"/><text x="505" y="260" fill="#087d72" font-family="Arial,sans-serif" font-size="22" font-weight="700">LIVE STEERING</text><path d="M505 291H744" stroke="#b5d4d2" stroke-width="8" stroke-linecap="round"/><path d="M505 291H658" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/><circle cx="658" cy="291" r="13" fill="#2778e8" stroke="#fff" stroke-width="4"/><rect x="475" y="392" width="315" height="188" rx="12" fill="#f3f6fb" stroke="#dbe3ed"/><text x="505" y="432" fill="#172b40" font-family="Arial,sans-serif" font-size="22" font-weight="700">QUEUED FOLLOW-UPS</text><g fill="#4d6477"><circle cx="514" cy="470" r="6"/><rect x="533" y="463" width="210" height="12" rx="6"/><circle cx="514" cy="507" r="6"/><rect x="533" y="500" width="175" height="12" rx="6"/><circle cx="514" cy="544" r="6"/><rect x="533" y="537" width="194" height="12" rx="6"/></g><text x="875" y="460" fill="#0e3442" font-family="Arial,sans-serif" font-size="30" font-weight="700">GUIDE THE RUN</text><text x="875" y="505" fill="#486876" font-family="Arial,sans-serif" font-size="23">Adjust direction</text><text x="875" y="538" fill="#486876" font-family="Arial,sans-serif" font-size="23">without restarting</text><path d="M885 590h150" stroke="#087d72" stroke-width="5" stroke-linecap="round"/><path d="m1015 575 18 15-18 15" fill="none" stroke="#087d72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="115" y="710" fill="#153e4c" font-family="Arial,sans-serif" font-size="45" font-weight="700">CODE · REVIEW · REDIRECT</text></svg>