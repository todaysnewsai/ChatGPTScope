<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Inside a local AI coding sandbox</title>
<desc id="desc">A technical editorial illustration showing a contained execution area around an AI coding agent, with filesystem, network, and credential boundaries represented as separate layers.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f0e7"/><stop offset="1" stop-color="#e4e9e5"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173d3a"/><stop offset="1" stop-color="#102b31"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8da9a0" stroke-opacity=".23" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="800" fill="url(#paper)"/>
<rect x="40" y="40" width="1120" height="720" rx="20" fill="url(#grid)" stroke="#bdc9c0" stroke-width="2"/>
<text x="82" y="105" fill="#173d3a" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">EXECUTION BOUNDARIES / 01</text>
<text x="82" y="160" fill="#142f32" font-family="Arial,sans-serif" font-size="43" font-weight="700">Local AI sandboxing</text>
<text x="82" y="197" fill="#4d6763" font-family="Arial,sans-serif" font-size="20">Restrict the tools an agent can reach — not the model itself</text>
<rect x="82" y="248" width="1036" height="420" rx="18" fill="#fffdf7" stroke="#b8c8bf" stroke-width="2"/>
<rect x="106" y="272" width="988" height="372" rx="14" fill="none" stroke="#c07a43" stroke-width="3" stroke-dasharray="11 9"/>
<text x="132" y="310" fill="#9a572a" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">HOST MACHINE / POLICY EDGE</text>
<rect x="150" y="344" width="270" height="230" rx="12" fill="#f3e6d7" stroke="#c07a43" stroke-width="2"/>
<text x="178" y="385" fill="#764526" font-family="Arial,sans-serif" font-size="17" font-weight="700">POLICY CONTROLS</text>
<g fill="#fffaf2" stroke="#d6b18f" stroke-width="1.5">
<rect x="178" y="407" width="214" height="39" rx="7"/><rect x="178" y="457" width="214" height="39" rx="7"/><rect x="178" y="507" width="214" height="39" rx="7"/>
</g>
<g fill="#764526" font-family="Arial,sans-serif" font-size="16">
<text x="195" y="432">Filesystem paths</text><text x="195" y="482">Network access</text><text x="195" y="532">Credentials</text>
</g>
<path d="M435 459H490" stroke="#6c8e82" stroke-width="4" stroke-linecap="round"/><path d="m477 447 13 12-13 12" fill="none" stroke="#6c8e82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="502" y="344" width="330" height="230" rx="12" fill="url(#panel)"/>
<rect x="522" y="364" width="290" height="190" rx="8" fill="none" stroke="#8ec8b6" stroke-width="2" stroke-dasharray="6 7"/>
<circle cx="667" cy="424" r="37" fill="#e9bd77"/><path d="M651 424l11 11 22-25" fill="none" stroke="#173d3a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="667" y="486" fill="#f7f4e9" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Agent tools</text>
<text x="667" y="516" fill="#a9d3c6" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Commands · local services</text>
<text x="667" y="537" fill="#a9d3c6" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Scoped by policy</text>
<path d="M848 459H901" stroke="#6c8e82" stroke-width="4" stroke-linecap="round"/><path d="m888 447 13 12-13 12" fill="none" stroke="#6c8e82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="913" y="344" width="157" height="230" rx="12" fill="#e3eee7" stroke="#83a89a" stroke-width="2"/>
<text x="991" y="385" fill="#214e44" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">ALLOWED</text>
<g fill="#214e44" font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><text x="991" y="424">Project files</text><text x="991" y="463">Approved hosts</text><text x="991" y="502">Permitted tokens</text></g>
<path d="M936 440H1046M936 479H1046M936 518H1046" stroke="#a4c3b4" stroke-width="1.5"/>
<text x="132" y="616" fill="#4d6763" font-family="Arial,sans-serif" font-size="15">A sandbox narrows access; it is not a guarantee that every agent action is isolated.</text>
<text x="82" y="716" fill="#173d3a" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">ARTICLES ABOUT AI · SECURITY &amp; DEVELOPER TOOLS</text>
</svg>