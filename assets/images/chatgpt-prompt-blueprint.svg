<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" rx="28" fill="#142438"/><text x="70" y="85" fill="#72dfce" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">ARTICLES ABOUT AI / FIELD GUIDE 03</text><text x="70" y="145" fill="#f7f5ed" font-family="Arial,sans-serif" font-size="42" font-weight="700">Build a better prompt</text><text x="70" y="185" fill="#b7cbd4" font-family="Arial,sans-serif" font-size="18">FIVE COMPONENTS · ONE CLEAR OUTCOME</text><rect x="70" y="225" width="650" height="420" rx="20" fill="#f4f1e8"/><text x="110" y="275" fill="#263d4a" font-family="Arial,sans-serif" font-size="19" font-weight="700">PROMPT WORKSHEET</text><g font-family="Arial,sans-serif" font-size="20" font-weight="700"><rect x="105" y="300" width="580" height="58" rx="10" fill="#fff"/><rect x="105" y="300" width="8" height="58" rx="4" fill="#238f93"/><text x="132" y="323" fill="#238f93" font-size="12">01 · TASK</text><text x="132" y="346" fill="#263d4a">What should the assistant do?</text><rect x="105" y="370" width="580" height="58" rx="10" fill="#fff"/><rect x="105" y="370" width="8" height="58" rx="4" fill="#4c82bb"/><text x="132" y="393" fill="#4c82bb" font-size="12">02 · CONTEXT</text><text x="132" y="416" fill="#263d4a">What information changes the answer?</text><rect x="105" y="440" width="580" height="58" rx="10" fill="#fff"/><rect x="105" y="440" width="8" height="58" rx="4" fill="#b47736"/><text x="132" y="463" fill="#a96c2d" font-size="12">03 · CONSTRAINTS</text><text x="132" y="486" fill="#263d4a">What rules or limits must be followed?</text><rect x="105" y="510" width="580" height="58" rx="10" fill="#fff"/><rect x="105" y="510" width="8" height="58" rx="4" fill="#8a6bb2"/><text x="132" y="533" fill="#8a6bb2" font-size="12">04 · OUTPUT FORMAT</text><text x="132" y="556" fill="#263d4a">What should the result look like?</text><rect x="105" y="580" width="580" height="40" rx="10" fill="#d9eee8"/><text x="132" y="606" fill="#176f69" font-size="15">05 · REVIEW → REFINE → VERIFY</text></g><rect x="760" y="225" width="370" height="420" rx="20" fill="#21394b" stroke="#527082"/><text x="795" y="270" fill="#72dfce" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">EXAMPLE REQUEST</text><text x="795" y="320" fill="#f7f5ed" font-family="Arial,sans-serif" font-size="25" font-weight="700"><tspan x="795" dy="0">Summarize this</tspan><tspan x="795" dy="32">report for a busy</tspan><tspan x="795" dy="32">team leader.</tspan></text><path d="M795 415H1095" stroke="#6b8797"/><text x="795" y="455" fill="#b7cbd4" font-family="Arial,sans-serif" font-size="17">Include:</text><text x="795" y="490" fill="#f7f5ed" font-family="Arial,sans-serif" font-size="18">• 5 key findings</text><text x="795" y="525" fill="#f7f5ed" font-family="Arial,sans-serif" font-size="18">• 3 recommended actions</text><text x="795" y="560" fill="#f7f5ed" font-family="Arial,sans-serif" font-size="18">• Plain English</text><text x="795" y="595" fill="#f7f5ed" font-family="Arial,sans-serif" font-size="18">• Cite page numbers</text><text x="70" y="710" fill="#a9bdc8" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">CLEAR ≠ COMPLICATED</text></svg>