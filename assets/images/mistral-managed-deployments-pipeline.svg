 <g stroke-linecap="round" stroke-width="5">
  <path d="M22 63h18" stroke="#b4f34a"/><path d="M50 63h112" stroke="#596477"/>
  <path d="M22 88h18" stroke="#8d9bff"/><path d="M50 88h146" stroke="#596477"/>
  <path d="M22 113h18" stroke="#b4f34a"/><path d="M50 113h95" stroke="#596477"/>
  <path d="M22 138h18" stroke="#8d9bff"/><path d="M50 138h128" stroke="#596477"/>
 </g>
 <text x="20" y="173" fill="#aab3c4" font-family="Arial,sans-serif" font-size="12">Build + worker output in Studio</text>
</g>
<path d="M894 328H910" stroke="#b4f34a" stroke-width="3" stroke-linecap="round"/>
<path d="M903 320l8 8-8 8" fill="none" stroke="#b4f34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="58" y="510" fill="#b4f34a" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">LESS INFRASTRUCTURE TO OPERATE</text>
<text x="58" y="550" fill="#dfe4ed" font-family="Arial,sans-serif" font-size="17">Public preview · Paid plans only · Concurrent deployment quotas apply</text>
<text x="1142" y="625" fill="#7c879b" text-anchor="end" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">PRODUCT UPDATE / 09 OCT 2026</text>
